<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать лот</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Hammer-Time</h1>

    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/lots}">Лоты</a>
        <a th:href="@{/profile}">Профиль</a>
    </nav>
</header>

<main>
    <h2>Создание лота</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/lots/create}"
          th:object="${form}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>Название:</label>
        <input type="text" th:field="*{title}">
        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

        <label>Описание:</label>
        <textarea th:field="*{description}" rows="5"></textarea>
        <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

        <label>Начальная цена:</label>
        <input type="number" step="0.01" th:field="*{startPrice}">
        <p class="error" th:if="${#fields.hasErrors('startPrice')}" th:errors="*{startPrice}"></p>

        <label>Минимальная ставка:</label>
        <input type="number" step="0.01" th:field="*{minBid}">
        <p class="error" th:if="${#fields.hasErrors('minBid')}" th:errors="*{minBid}"></p>

        <label>Время начала:</label>
        <input type="datetime-local" th:field="*{startTime}">
        <p class="error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></p>

        <label>Время окончания:</label>
        <input type="datetime-local" th:field="*{endTime}">
        <p class="error" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></p>

        <label>Фотографии:</label>
        <input type="file" name="images" multiple accept="image/*">

        <button type="submit">Создать лот</button>
    </form>
</main>

</body>
</html>
