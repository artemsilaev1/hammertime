<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админка: пользователи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Hammer-Time</h1>
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/lots}">Лоты</a>
        <a th:href="@{/admin/users}">Пользователи</a>
        <a th:href="@{/admin/lots}">Лоты админки</a>
    </nav>
</header>

<main>
    <h2>Управление пользователями</h2>

    <table class="admin-table">
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Баланс</th>
            <th>Изменить баланс</th>
        </tr>

        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.firstName + ' ' + user.lastName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.balance}"></td>
            <td>
                <form th:action="@{/admin/users/{id}/balance(id=${user.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="number" step="0.01" min="0" name="balance" required>
                    <button type="submit">Сохранить</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
