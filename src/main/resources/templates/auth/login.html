<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Hammer-Time</h1>
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/register}">Регистрация</a>
    </nav>
</header>

<main>
    <h2>Вход в аккаунт</h2>

    <p class="success" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <p class="error" th:if="${param.error}">
        Неверный email или пароль. Возможно, аккаунт ещё не активирован.
    </p>

    <p class="success" th:if="${param.logout}">
        Вы вышли из аккаунта.
    </p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Пароль:</label>
        <input type="password" name="password" required>

        <label class="checkbox">
            <input type="checkbox" name="remember-me">
            Запомнить меня
        </label>

        <button type="submit">Войти</button>
    </form>

    <p>
        Нет аккаунта?
        <a th:href="@{/register}">Зарегистрироваться</a>
    </p>
</main>

</body>
</html>
