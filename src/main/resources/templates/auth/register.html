<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Hammer-Time</h1>
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/login}">Вход</a>
    </nav>
</header>

<main>
    <h2>Регистрация</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>Имя:</label>
        <input type="text" th:field="*{firstName}">
        <p class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>

        <label>Фамилия:</label>
        <input type="text" th:field="*{lastName}">
        <p class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>

        <label>Email:</label>
        <input type="email" th:field="*{email}">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label>Пароль:</label>
        <input type="password" th:field="*{password}">
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button type="submit">Зарегистрироваться</button>
    </form>
</main>

</body>
</html>
