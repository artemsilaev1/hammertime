<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый пароль — Hammer-Time</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Hammer-Time</h1>
    <p>Установка нового пароля</p>

    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/login}">Вход</a>
    </nav>
</header>

<main>
    <section class="card auth-card">
        <h2>Введите новый пароль</h2>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/reset-password/{code}(code=${code})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Новый пароль:</label>
            <input type="password" name="password" placeholder="Минимум 6 символов" required>

            <label>Повторите пароль:</label>
            <input type="password" name="repeatPassword" placeholder="Повторите пароль" required>

            <button type="submit">Сохранить новый пароль</button>
        </form>

        <p class="hint">
            <a th:href="@{/login}">Вернуться ко входу</a>
        </p>
    </section>
</main>

</body>
</html>
