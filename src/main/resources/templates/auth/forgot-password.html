<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля — Hammer-Time</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Hammer-Time</h1>
    <p>Восстановление доступа</p>

    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/login}">Вход</a>
        <a th:href="@{/register}">Регистрация</a>
    </nav>
</header>

<main>
    <section class="card auth-card">
        <h2>Восстановление пароля</h2>

        <p>
            Введите email, который использовался при регистрации.
            Если такой пользователь существует, на почту придёт ссылка для смены пароля.
        </p>

        <p class="success" th:if="${success}" th:text="${success}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Email:</label>
            <input type="email" name="email" placeholder="Введите email" required>

            <button type="submit">Отправить ссылку</button>
        </form>

        <p class="hint">
            <a th:href="@{/login}">Вернуться ко входу</a>
        </p>
    </section>
</main>

</body>
</html>
